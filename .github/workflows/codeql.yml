name: "CodeQL Advanced"

on:
  push:
    branches: [ "main", "2.0" ]
  pull_request:
    branches: [ "main", "2.0" ]
  schedule:
    - cron: '30 2 * * 1' # Runs every Monday at 2:30 AM

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      # required for all workflows
      security-events: write
      # required to fetch internal or private CodeQL packs
      packages: read
      # only required for workflows in private repositories
      actions: read
      contents: read

    strategy:
      fail-fast: false
      matrix:
        include:
        - language: java-kotlin
          build-mode: manual
        - language: c-cpp
          build-mode: manual
        - language: actions
          build-mode: none

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    # 1. Setup Java for Android Builds
    - name: Set up JDK 17
      if: matrix.language == 'java-kotlin' || matrix.language == 'c-cpp'
      uses: actions/setup-java@v4
      with:
        java-version: '17' # Change to '21' if your project requires it
        distribution: 'temurin'
        cache: 'gradle'

    # 2. Initialize CodeQL
    - name: Initialize CodeQL
      uses: github/codeql-action/init@v3
      with:
        languages: ${{ matrix.language }}
        build-mode: ${{ matrix.build-mode }}
        # If you wish to specify custom queries, you can do so here.
        # queries: security-extended,security-and-quality

    # 3. Manual Build Step (Fixes the Autobuild error)
    - name: Build Android Project for CodeQL
      if: matrix.language == 'java-kotlin' || matrix.language == 'c-cpp'
      run: |
        chmod +x gradlew
        # Compile the debug variant without running tests to save time
        ./gradlew assembleDebug -x test --no-daemon

    # 4. Perform Analysis
    - name: Perform CodeQL Analysis
      uses: github/codeql-action/analyze@v3
      with:
        category: "/language:${{matrix.language}}"
