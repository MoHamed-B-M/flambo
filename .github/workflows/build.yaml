name: Flambo 2.0 CI

on:
  push:
    branches: ["2.0"]
  pull_request:
    branches: ["2.0"]
  workflow_dispatch:

concurrency:
  group: flambo-2.0-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  GRADLE_OPTS: -Xmx4g -Dorg.gradle.daemon=false -Dorg.gradle.parallel=true

jobs:
  build:
    name: Build signed release APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Install Android SDK packages
        run: |
          SDK_ROOT="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          SDKMANAGER=$(find "$SDK_ROOT/cmdline-tools" -name sdkmanager -type f | head -n1)
          echo "sdkmanager=$SDKMANAGER"
          if [[ -z "$SDKMANAGER" ]]; then echo "No sdkmanager found!"; exit 1; fi
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0"

      - name: Prepare signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -e
          if [[ -n "$KEYSTORE_BASE64" ]]; then
            echo "→ Decoding Flambo release keystore from secrets"
            echo "$KEYSTORE_BASE64" | base64 --decode > app/release.keystore
            echo "KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
            echo "KEY_ALIAS=$KEY_ALIAS" >> "$GITHUB_ENV"
            echo "KEY_PASSWORD=$KEY_PASSWORD" >> "$GITHUB_ENV"
          else
            echo "→ No KEYSTORE_BASE64 — generating ephemeral preview keystore"
            keytool -genkeypair -v \
              -keystore app/release.keystore \
              -storepass flambo123 \
              -alias flambo \
              -keypass flambo123 \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Flambo Preview, OU=CI, O=Flambo, L=Cairo, S=Cairo, C=EG"
            echo "KEYSTORE_PASSWORD=flambo123" >> "$GITHUB_ENV"
            echo "KEY_ALIAS=flambo" >> "$GITHUB_ENV"
            echo "KEY_PASSWORD=flambo123" >> "$GITHUB_ENV"
          fi
          ls -lh app/release.keystore

      - name: Resolve version
        run: |
          echo "FLAMBO_VERSION_NAME=2.0.0-dev(#${{ github.run_number }})" >> "$GITHUB_ENV"
          echo "FLAMBO_VERSION_CODE=$((200000 + ${{ github.run_number }}))" >> "$GITHUB_ENV"
          echo "Version: 2.0.0-dev(#${{ github.run_number }}) code $((200000 + ${{ github.run_number }}))"

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build signed release
        run: ./gradlew :app:assembleRelease --stacktrace --console=plain

      - name: Generate checksums
        run: |
          for apk in app/build/outputs/apk/release/*.apk; do
            sha256sum "$apk" > "$apk.sha256"
            cat "$apk.sha256"
          done

      - name: Upload release APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Flambo-2.0-dev${{ github.run_number }}
          path: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/apk/release/*.sha256
          retention-days: 14
          if-no-files-found: warn

      - name: Unit tests
        run: ./gradlew :app:testDebugUnitTest --stacktrace --console=plain

      - name: Lint
        run: ./gradlew :app:lintDebug --stacktrace --console=plain

      - name: Upload unit test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-results
          path: app/build/test-results/testDebugUnitTest
          retention-days: 7
          if-no-files-found: warn

      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-report
          path: app/build/reports/lint-results-debug.*
          retention-days: 7
          if-no-files-found: warn
